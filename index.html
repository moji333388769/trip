<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;color-scheme:light}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 "Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;padding:calc(56px + env(safe-area-inset-top,0px)) 0 40px}
nav{position:fixed;top:0;left:0;right:0;z-index:9;background:var(--paper);border-bottom:3px solid var(--ink);padding:env(safe-area-inset-top,0px) 10px 0;display:flex;gap:6px;overflow-x:auto;align-items:center;height:calc(56px + env(safe-area-inset-top,0px))}
nav a{flex:none;color:var(--ink);text-decoration:none;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;background:var(--yellow);font-size:15px}
nav a:nth-child(2n){background:var(--sky)}nav a:nth-child(3n){background:var(--green)}nav a:nth-child(5n){background:var(--coral)}
main{max-width:640px;margin:0 auto;padding:0 14px}
section{margin-top:28px}h2{margin:0 0 10px;font-size:22px}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:14px;margin-bottom:12px}
.hero{padding:0;overflow:hidden;background:var(--sky)}.hero svg{display:block;width:100%;height:auto}
h1{margin:14px 0 2px;font-size:30px;text-align:center}.sub{text-align:center;margin:0 0 10px}
.cd{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--yellow);font-size:18px}.cd b{font-size:38px;line-height:1}
label{display:block;font-size:13px;margin:6px 0 2px}
input,select,button,textarea{font:inherit;color:var(--ink)}
input[type=text],input[type=time],input[type=date],select,textarea{width:100%;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 10px;min-height:42px}
.btn{border:3px solid var(--ink);border-radius:999px;background:var(--green);padding:3px 14px;cursor:pointer}
.btn.c{background:var(--coral)}.btn.s{background:var(--sky)}.btn.sm{padding:0 10px;font-size:13px;min-height:30px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.fh{display:inline-block;border:3px solid var(--ink);border-radius:999px;padding:0 12px;background:var(--coral);margin-bottom:4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}
.tab{flex:none;width:58px;border:3px solid var(--ink);border-radius:20px;background:var(--paper);text-align:center;padding:4px 0;cursor:pointer;line-height:1.3}
.tab small{display:block;font-size:12px}.tab b{font-size:20px}.tab.on{background:var(--yellow);transform:translateY(-3px)}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.88) translateY(14px);opacity:.3}100%{transform:none;opacity:1}}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:3px dashed var(--ink)}
.tl li{position:relative;margin:0 0 12px 12px;border:3px solid var(--ink);border-radius:20px;padding:8px 12px;background:#fff}
.tl li:before{content:"";position:absolute;left:-30px;top:16px;width:14px;height:14px;border:3px solid var(--ink);border-radius:50%;background:var(--coral)}
.tm{font-size:14px}.tt{font-size:17px}
.tag,.must{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12px;margin-right:4px;background:var(--sky)}
.t-新幹線{background:var(--coral)}.t-電車{background:var(--green)}.t-地鐵{background:var(--yellow)}.t-巴士{background:var(--sky)}.t-步行{background:#fff}.t-計程車{background:var(--yellow)}.t-飛機{background:var(--sky)}
.must{background:var(--coral);transform:rotate(-4deg)}
.acts{margin-top:6px;display:flex;gap:6px}.empty{text-align:center;opacity:.7;padding:10px}
.ck{list-style:none;margin:0;padding:0}.ck li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dotted var(--ink)}
.ck input[type=checkbox]{appearance:none;flex:none;width:26px;height:26px;border:3px solid var(--ink);border-radius:9px;background:#fff;margin:0;cursor:pointer}
.ck input:checked{background:var(--green)}.ck input:checked:after{content:"✓";display:block;text-align:center;line-height:20px;font-size:18px}
.ck input:checked+span{text-decoration:line-through;opacity:.55}.ck span{flex:1}
.ck .x{border:0;background:none;font-size:18px;cursor:pointer}
.add{display:flex;gap:8px;margin-top:10px}
.c1{background:var(--sky)}.c2{background:var(--green)}.c3{background:var(--yellow)}
textarea{height:90px;margin-top:8px;font-size:13px}
.cloud{animation:drift 9s ease-in-out infinite alternate}.cloud.b{animation-duration:13s}
.train{animation:go 7s linear infinite}.snow circle{animation:fall 5s linear infinite}
.snow circle:nth-child(2n){animation-duration:7s;animation-delay:-2s}.snow circle:nth-child(3n){animation-delay:-4s}
.koke{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
.lamp{animation:blink 2s steps(2) infinite}
@keyframes drift{to{transform:translateX(26px)}}@keyframes go{0%{transform:translateX(-140px)}100%{transform:translateX(420px)}}
@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(200px)}}
@keyframes sway{50%{transform:rotate(7deg)}}@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:2px 14px;cursor:pointer}.chip.on{background:var(--coral);transform:translateY(-2px)}
.rec{background:var(--green)}.bar{height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:var(--coral)}
.full{opacity:.6}.full .nm{text-decoration:line-through}.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12px;background:var(--sky);margin-right:4px}.pill.f{background:var(--coral)}
html,body{max-width:100%;overflow-x:hidden}
main,section,.card,.grid>div{min-width:0}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{min-width:0;max-width:100%}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
.add input{flex:1;min-width:0}.add .btn{flex:none}
.tt,.tm,.nm,.tl li,.ck span,label{overflow-wrap:anywhere}img,svg{max-width:100%}
.tw circle{animation:blink 1.6s steps(2) infinite}.tw circle:nth-child(2n){animation-delay:-.8s}.swing{transform-box:fill-box;transform-origin:50% 0;animation:swg 3s ease-in-out infinite alternate}@keyframes swg{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.nt{margin-top:4px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;opacity:.85}#f-note,#p-note{height:64px;margin-top:0}.tc{display:inline-block;margin:0;font-size:15px;cursor:pointer}
</style></head><body>

<h1>仙台 × 東京</h1><p class="sub">12/1（二）– 12/7（一）　七天六夜</p>
<div class="card cd" aria-live="polite"><span id="cdtxt"></span></div></section>

<section id="flight"><h2>✈️ 航班</h2><div id="fl"></div></section>
<section id="plan"><h2>🗓 每日行程</h2><div class="tabs" id="tabs"></div><div id="day"></div></section>
<section id="pay"><h2>💳 刷卡優惠</h2><div class="card c3"><div style="margin-bottom:6px">現在要買什麼？</div><div class="chips" id="chips"></div><label>預計消費金額（台幣，可不填）</label><input type="number" inputmode="numeric" id="amt" placeholder="例：3000"><div id="rec"></div></div><div id="offers"></div></section>
<section id="stay"><h2>🏠 住宿資訊</h2><div id="st"></div></section>
<section id="bk"><h2>💾 備份</h2><div class="card"><p style="margin:0 0 8px;font-size:14px">資料只存在這個瀏覽器。換手機前請先匯出，再到新裝置貼上匯入。</p>
<button class="btn s" id="ex">匯出</button> <button class="btn c" id="im">匯入</button><textarea id="ta" placeholder="匯出的內容會顯示在這裡；匯入請貼上後按「匯入」"></textarea></div></section>
</main>
<script>
const KEY='trip-sendai-tokyo',$=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TR=['飛機','新幹線','地鐵','巴士','步行','計程車'],WD=['二','三','四','五','六','日','一'];
const def=()=>({fl:{out:{},back:{}},st:[{c:'仙台'},{c:'東京'}],
days:[[{time:'',title:'抵達仙台',tr:'飛機',must:0}],[],[],[],[],[],[{time:'',title:'前往機場，回程',tr:[],must:0}]]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.days)S=def();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let cur=0,ed=null;
/* countdown */
const t0=new Date('2026-12-01T00:00:00+08:00'),t1=new Date('2026-12-08T00:00:00+08:00'),now=new Date();
const cd=$('#cdtxt');
if(now<t0)cd.innerHTML='距離出發還有 <b>'+Math.ceil((t0-now)/864e5)+'</b> 天';
else if(now<t1){cur=Math.min(6,Math.floor((now-t0)/864e5));cd.innerHTML='旅行中！今天是第 <b>'+(cur+1)+'</b> 天'}
else cd.textContent='旅程結束，歡迎回家 🏡';
/* flight & stay */
const F=(p,l,ph,ty)=>`<div><label>${l}</label><input type="${ty||'text'}" data-p="${p}" placeholder="${ph||''}" value="${esc(p.split('.').reduce((o,k)=>o&&o[k],S))}"></div>`;
const flc=(k,n,col)=>`<div class="card ${col}"><span class="fh">${n}</span><div class="grid">${F('fl.'+k+'.no','航班號','例：BR000')}${F('fl.'+k+'.date','日期','','date')}${F('fl.'+k+'.from','出發機場','TPE')}${F('fl.'+k+'.to','抵達機場','SDJ')}${F('fl.'+k+'.dep','起飛時間','','time')}${F('fl.'+k+'.arr','抵達時間','','time')}</div></div>`;
$('#fl').innerHTML=flc('out','去程 12/1','c1')+flc('back','回程 12/7','c3');
$('#st').innerHTML=S.st.map((s,i)=>`<div class="card ${i?'c3':'c1'}"><span class="fh">${s.c}</span>${F('st.'+i+'.n','住宿名稱')}<div class="grid">${F('st.'+i+'.i','入住日期','','date')}${F('st.'+i+'.o','退房日期','','date')}</div>${F('st.'+i+'.pr','住宿總價','例：NT$ 24,000 或 ¥60,000')}${F('st.'+i+'.m','訂房編號／備註')}</div>`).join('');
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(!p)return;const k=p.split('.');let o=S;k.slice(0,-1).forEach(x=>{o[x]=o[x]||{};o=o[x]});o[k.pop()]=e.target.value;save()});
/* days */
function tabs(){$('#tabs').innerHTML=S.days.map((_,i)=>`<button class="tab ${i==cur?'on':''}" data-d="${i}" aria-label="12/${i+1}"><small>週${WD[i]}</small><b>12/${i+1}</b></button>`).join('')}
const trs=it=>(Array.isArray(it.tr)?it.tr:(it.tr?[it.tr]:[])).filter(t=>TR.includes(t));
const form=(it,i)=>`<li><label>時間（可不填）</label><input type="time" id="f-time" value="${esc(it.time)}"><label>行程</label><input type="text" id="f-title" value="${esc(it.title)}" placeholder="地點或活動"><label>交通方式（可複選）</label><div class="chips">${TR.map(t=>`<label class="chip tc ${trs(it).includes(t)?'on':''}"><input type="checkbox" class="f-tr" value="${t}" ${trs(it).includes(t)?'checked':''} hidden>${t}</label>`).join('')}</div><label>備註</label><textarea id="f-note" placeholder="例：訂位資訊、營業時間、注意事項">${esc(it.note)}</textarea><label><input type="checkbox" id="f-must" ${it.must?'checked':''}> 必去 ⭐</label><div class="acts"><button class="btn sm" data-a="ok" data-i="${i}">儲存</button><button class="btn sm c" data-a="no">取消</button></div></li>`;
function day(anim){const A=S.days[cur];let h=`<div class="card ${anim?'pop':''}"><ul class="tl">`;
A.forEach((it,i)=>{h+=ed===i?form(it,i):`<li>${it.time?`<div class="tm">${esc(it.time)}</div>`:''}<div class="tt">${esc(it.title)}</div>${trs(it).map(t=>`<span class="tag t-${t}">${t}</span>`).join('')}${it.must?'<span class="must">必去</span>':''}${it.note?`<div class="nt">${esc(it.note)}</div>`:''}<div class="acts"><button class="btn sm s" data-a="ed" data-i="${i}">編輯</button><button class="btn sm c" data-a="del" data-i="${i}">刪除</button></div></li>`});
if(ed==='new')h+=form({time:'',title:'',tr:[],note:'',must:0},'new');
if(!A.length&&ed!=='new')h+='<li class="empty">這天還沒有行程</li>';
h+=`</ul>${ed===null?'<button class="btn" data-a="add">＋ 新增行程</button>':''}</div>`;$('#day').innerHTML=h}
$('#tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;cur=+b.dataset.d;ed=null;tabs();day(1)};
$('#day').onchange=e=>{if(e.target.classList.contains('f-tr'))e.target.parentNode.classList.toggle('on',e.target.checked)};
$('#day').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,A=S.days[cur];
if(a=='add')ed='new';else if(a=='ed')ed=+i;else if(a=='no')ed=null;else if(a=='del'){A.splice(+i,1)}
else if(a=='ok'){const it={time:$('#f-time').value,title:$('#f-title').value.trim()||'未命名行程',tr:[...document.querySelectorAll('.f-tr:checked')].map(x=>x.value),note:$('#f-note').value.trim(),must:$('#f-must').checked?1:0};
if(i=='new')A.push(it);else A[+i]=it;A.sort((x,y)=>(x.time||'99').localeCompare(y.time||'99'));ed=null}save();day()};
/* backup */
$('#ex').onclick=()=>{const t=$('#ta');t.value=JSON.stringify(S);t.select();try{navigator.clipboard.writeText(t.value)}catch(e){}};
$('#im').onclick=()=>{try{const d=JSON.parse($('#ta').value);if(!d.days)throw 0;S=d;save();location.reload()}catch(e){alert('匯入失敗，請確認內容完整')}};
/* pay */
S.cards=S.cards||[];let pc='餐廳',pe=null;
const CATS=['餐廳','藥妝','購物','超商','交通','住宿','網購','其他'];
const td=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const live=o=>(!o.s||td()>=o.s)&&(!o.e||td()<=o.e),cap=o=>+o.cap>0?+o.cap:Infinity,rem=o=>Math.max(0,cap(o)-(+o.used||0)),money=n=>n===Infinity?'無上限':'NT$'+Math.round(n).toLocaleString();
function rec(){const a=+$('#amt').value||0,all=S.cards.filter(o=>o.cat==='全部'||o.cat===pc),
c=all.filter(o=>live(o)&&rem(o)>0).map(o=>({o,r:a?Math.min(a*o.rate/100,rem(o)):0})).sort((x,y)=>y.r-x.r||y.o.rate-x.o.rate),fu=all.filter(o=>live(o)&&rem(o)<=0);let h='';
if(!c.length)h='<div class="card" style="margin:10px 0 0">目前沒有可用的優惠'+(S.cards.length?'（可能額度已滿、已過期或類別不符）':'，請先在下方新增')+'。</div>';
else{const t=c[0],o=t.o,fr=a*o.rate/100;
h=`<div class="card rec" style="margin:10px 0 0"><div class="tm">推薦使用</div><div style="font-size:22px">${esc(o.card)}</div><div>${esc(o.name)}・回饋 ${o.rate}%</div>${a?`<div>預估回饋 ${money(t.r)}${t.r<fr?'（額度不足，只回饋剩餘部分）':''}</div>`:''}<div>剩餘額度 ${money(rem(o))}</div>${o.note?`<div class="nt">${esc(o.note)}</div>`:''}${a&&t.r>0?`<div class="acts"><button class="btn sm" data-r="${S.cards.indexOf(o)}">記一筆消費</button></div>`:''}</div>`;
c.slice(1,3).forEach(x=>h+=`<div class="tm" style="margin-top:6px">備選：${esc(x.o.card)} ${esc(x.o.name)}・${x.o.rate}%・剩 ${money(rem(x.o))}</div>`)}
if(fu.length)h+=`<div class="tm" style="margin-top:6px">已額滿：${fu.map(o=>esc(o.card)).join('、')}</div>`;$('#rec').innerHTML=h}
const oform=(o,i)=>`<div class="card"><label>卡片名稱</label><input type="text" id="p-card" value="${esc(o.card)}" placeholder="例：國泰 CUBE 卡"><label>優惠內容</label><input type="text" id="p-name" value="${esc(o.name)}" placeholder="例：日本消費 3.5%"><label>適用類別</label><select id="p-cat">${['全部',...CATS].map(c=>`<option ${c==o.cat?'selected':''}>${c}</option>`).join('')}</select><div class="grid"><div><label>回饋率 %</label><input type="number" step="0.1" id="p-rate" value="${o.rate??''}"></div><div><label>回饋上限（元，空白＝無上限）</label><input type="number" id="p-cap" value="${o.cap||''}"></div><div><label>已回饋（元）</label><input type="number" id="p-used" value="${o.used||0}"></div><div></div><div><label>開始日</label><input type="date" id="p-s" value="${o.s||''}"></div><div><label>結束日</label><input type="date" id="p-e" value="${o.e||''}"></div></div><label>備註</label><textarea id="p-note" placeholder="例：需登錄活動、限指定通路、單筆上限">${esc(o.note)}</textarea><div class="acts"><button class="btn sm" data-o="ok" data-i="${i}">儲存</button><button class="btn sm c" data-o="no">取消</button></div></div>`;
function offers(){let h='';S.cards.forEach((o,i)=>{if(pe===i){h+=oform(o,i);return}
const f=rem(o)<=0,x=!live(o),p=cap(o)===Infinity?0:Math.min(100,(+o.used||0)/cap(o)*100);
h+=`<div class="card ${f||x?'full':''}"><div class="tt nm">${esc(o.card)}</div><div>${esc(o.name)}</div><span class="pill">${o.cat}</span><span class="pill">${o.rate}%</span>${f?'<span class="pill f">額度已滿</span>':''}${x?'<span class="pill f">不在期限內</span>':''}${o.s||o.e?`<div class="tm">${o.s||'…'} ～ ${o.e||'…'}</div>`:''}${cap(o)!==Infinity?`<div class="bar" style="margin-top:6px"><i style="width:${p}%"></i></div><div class="tm">已回饋 ${money(+o.used||0)} / ${money(cap(o))}</div>`:`<div class="tm">已回饋 ${money(+o.used||0)}（無上限）</div>`}${o.note?`<div class="nt">${esc(o.note)}</div>`:''}<div class="acts"><button class="btn sm s" data-o="ed" data-i="${i}">編輯</button><button class="btn sm c" data-o="del" data-i="${i}">刪除</button></div></div>`});
if(pe==='new')h+=oform({cat:'全部'},'new');
if(!S.cards.length&&pe!=='new')h='<div class="card empty">還沒有優惠，新增你的信用卡優惠吧</div>';
if(pe===null)h+='<button class="btn" data-o="add">＋ 新增優惠</button>';$('#offers').innerHTML=h}
function pay(){$('#chips').innerHTML=CATS.map(c=>`<button class="chip ${c==pc?'on':''}" data-c="${c}">${c}</button>`).join('');rec();offers()}
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){pc=c;pay()}};$('#amt').oninput=rec;
$('#rec').onclick=e=>{const r=e.target.dataset.r;if(r==null)return;const o=S.cards[+r],a=+$('#amt').value||0;o.used=(+o.used||0)+Math.round(Math.min(a*o.rate/100,rem(o)));save();$('#amt').value='';pay()};
$('#offers').onclick=e=>{const b=e.target.closest('[data-o]');if(!b)return;const a=b.dataset.o,i=b.dataset.i;
if(a=='add')pe='new';else if(a=='ed')pe=+i;else if(a=='no')pe=null;else if(a=='del')S.cards.splice(+i,1);
else if(a=='ok'){const v=k=>$('#p-'+k).value,o={card:v('card').trim()||'未命名卡片',name:v('name').trim(),cat:v('cat'),rate:+v('rate')||0,cap:+v('cap')||0,used:+v('used')||0,s:v('s'),e:v('e'),note:v('note').trim()};if(i=='new')S.cards.push(o);else S.cards[+i]=o;pe=null}
save();pay()};
tabs();day();pay();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script></body></html>
